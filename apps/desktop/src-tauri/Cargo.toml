[package]
name = "jenderalremote-desktop"
description = "JenderalRemote Desktop — Tauri 2 shell for the Rust remote engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "jenderalremote-desktop"

[lib]
name = "jenderalremote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jenderalremote-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
remote-protocol = { workspace = true }
remote-core = { workspace = true }
remote-security = { workspace = true }
remote-telemetry = { workspace = true }
remote-webrtc = { workspace = true }
remote-capture = { workspace = true, features = ["xcap"] }
remote-input = { workspace = true, features = ["enigo"] }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
keyring.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Coturn untuk pengembangan lokal (rancangan teknis §4, §15).
# Produksi: ganti realm, aktifkan TLS (cert/acme), dan gunakan
# kredensial sementara (use-auth-secret) — jangan user statis.
listening-port=3478
tls-listening-port=5349

# LAN dev saja:
listening-ip=0.0.0.0
external-ip=0.0.0.0
realm=jenderalremote.dev
server-name=jenderalremote-turn

# Kredensial statis DEV (user: jenderal / pass: devturn123).
# Di produksi, ganti dengan `use-auth-secret` + `static-auth-secret`.
lt-cred-mech
user=jenderal:devturn123

# Rentang port relay
min-port=49160
max-port=49200

# Jangan multi-thread worker per core berlebihan di dev
no-cli
no-tls
no-dtls
# Aktifkan untuk produksi bersama sertifikat:
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem

log-file=stdout
verbose
